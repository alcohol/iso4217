version: 2
updates:

  # github actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "alcohol"

  # project php dependencies
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "alcohol"

  # isolated tooling (php-cs-fixer, phpstan)
  - package-ecosystem: "composer"
    directories:
      - "/tools/php-cs-fixer"
      - "/tools/phpstan"
    schedule:
      interval: "monthly"
    assignees:
      - "alcohol"
